# =============================================================================
# CI do monorepo — PDV (Python e C#), retaguarda (Next.js) e serviço fiscal (C#)
# =============================================================================
#
# Cada job existe por causa de um defeito real, encontrado numa revisão em que
# tudo parecia verde na máquina de quem escreveu:
#
# * 15 testes de integração da nuvem **pulavam em silêncio** sem Postgres, e o
#   resumo continuava verde. Aqui o Postgres existe e teste pulado REPROVA.
# * um teste dependia de `DATABASE_URL` sem declarar: passava para quem tinha a
#   variável no terminal e falhava para todo o resto.
# * o `requirements.txt` do PDV não era o que rodava: os pins nunca tinham
#   passado pela suíte, e o primeiro deles nem instalava em Python 3.14.
#
# Por isso os jobs instalam SÓ o que está pinado, num ambiente limpo, e rodam
# no runtime que vai para produção.

name: CI

on:
  push:
    # port/**: o porte para C# (docs/port_csharp.md) roda a suíte inteira
    # antes de chegar à main.
    branches: [main, "port/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  desktop:
    name: PDV (Windows, Python 3.14)
    # Windows e não Linux: o PDV é um app Windows (pywin32, spooler, DPAPI). Um
    # verde em Ubuntu diria pouco sobre o que roda no caixa.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop-pdv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/desktop-pdv/requirements.txt

      # Node entra no job do PDV por causa do contrato criptográfico: o teste
      # executa a assinatura da nuvem (TypeScript) e compara byte a byte com a
      # do terminal. Sem Node ele pularia — e aqui pular reprova.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar exatamente os pins
        run: python -m pip install -r requirements.txt

      - name: Suíte completa
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider --junitxml=report.xml

      - name: Nenhum teste pode ter pulado
        shell: python
        run: |
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("report.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print(f"{suite.get('tests')} testes, {skipped} pulados")
          if skipped:
              sys.exit("Teste pulado não prova nada. Ver o motivo com pytest -rs.")

  # ---------------------------------------------------------------------------
  desktop-net:
    name: PDV em C# (Windows, .NET 10)
    # O porte para C# acontece por etapas (docs/port_csharp.md). Durante a
    # transição os dois PDVs gravam o mesmo ledger: os testes leem
    # contracts/audit-chain.json, gerado pelo Python, e exigem igualdade byte a
    # byte. Teste pulado reprova, como no job do Python.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pdv-net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Para o crosscheck: ele importa o PDV em Python direto do código-fonte.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Só os dois pacotes que o crosscheck usa, nos pins do requirements.txt
      # do PDV: argon2-cffi (PIN) e pywin32 (DPAPI do cofre).
      - name: Pins do PDV em Python usados na conferência
        run: python -m pip install argon2-cffi==25.1.0 pywin32==312

      # DPAPI prende o blob à máquina: o cofre do Python é gravado aqui, neste
      # runner, para o C# ler na suíte (SecretVaultTests).
      - name: Cofre gravado pelo PDV em Python
        run: python crosscheck.py write-vault "${{ runner.temp }}\py-vault"

      - name: Build e testes
        env:
          PDV_CROSSCHECK_OUT: ${{ runner.temp }}\crosscheck.db
          PDV_PY_VAULT_DIR: ${{ runner.temp }}\py-vault
        run: dotnet test --logger "trx;LogFileName=report.trx" --results-directory TestResults

      # A volta dos contratos: o ledger, o hash de PIN e o cofre que o C#
      # gravou, verificados pelo código do PDV em Python.
      - name: O PDV em Python aceita o que o C# gravou
        run: python crosscheck.py "${{ runner.temp }}\crosscheck.db" "${{ runner.temp }}\csharp-vault"

      # O que só o binário prova: o PDV.exe (WinUI, self-contained) abre, a
      # tela liga o teclado aos comandos certos e o PIN que o Python cadastrou
      # entra. Dirigido pela UI Automation, como um operador.
      # O `dotnet test` só compila o que os testes referenciam, e nenhum
      # teste referencia a casca WinUI: sem este passo não existe PDV.exe.
      - name: Build do PDV.exe (WinUI)
        run: dotnet build src/Pdv.WinUI -c Debug -nologo

      - name: O caixa abre e o login funciona no binario
        shell: powershell
        run: .\tools\ui-smoke.ps1

      - name: Nenhum teste pode ter pulado
        shell: pwsh
        run: |
          [xml] $report = Get-Content (Get-ChildItem TestResults -Recurse -Filter report.trx | Select-Object -First 1).FullName
          $counters = $report.TestRun.ResultSummary.Counters
          Write-Host "$($counters.total) testes, $($counters.notExecuted) pulados"
          if ([int] $counters.notExecuted -gt 0) { throw 'Teste pulado nao prova nada.' }

  # ---------------------------------------------------------------------------
  cloud:
    name: Retaguarda (Next.js + Postgres real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cloud-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_DB_PASSWORD: senha-de-ci-do-papel-app
      TEST_DATABASE_URL: postgres://erp:erp@localhost:5432/erp
      TEST_APP_DATABASE_URL: postgres://erp_app:senha-de-ci-do-papel-app@localhost:5432/erp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/cloud-api/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Tipagem
        run: npx tsc --noEmit

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Migrations num banco vazio
        env:
          DATABASE_URL: postgres://erp:erp@localhost:5432/erp
        run: node --experimental-strip-types scripts/migrate.ts

      # O papel `erp_app` NÃO é superusuário. É o único jeito de o teste de RLS
      # provar alguma coisa: superusuário ignora política, com ou sem FORCE.
      - name: Testes contra Postgres real
        run: npx vitest run --reporter=default --reporter=json --outputFile=vitest.json

      - name: Nenhum teste pode ter pulado
        run: |
          node -e '
            const r = require("./vitest.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(`${r.numTotalTests} testes, ${skipped} pulados`);
            if (skipped > 0) {
              console.error("Teste pulado não prova nada.");
              process.exit(1);
            }'

      # SEM nenhuma variável de ambiente, de propósito. Uma versão anterior
      # exigia DATABASE_URL no build só para fazer o parse da URL, o que
      # obrigaria a gravar a credencial de produção na imagem.
      - name: Build sem segredo nenhum
        run: env -i PATH="$PATH" HOME="$HOME" npm run build

  # ---------------------------------------------------------------------------
  fiscal:
    name: Serviço fiscal (C#, .NET 10, Linux)
    # O emissor de NFC-e (DFe.NET). Roda em Linux porque é onde ele roda no
    # Coolify: assinatura XMLDSig, XSD oficial e TLS com certificado de cliente
    # já tiveram diferenças entre Windows e Linux em outras bibliotecas.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fiscal-net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Paridade com o serviço em Python, a NFC-e validada no XSD oficial, e o
      # motor contra cada resposta da SEFAZ (SEFAZ simulada).
      - name: Testes
        run: dotnet test --logger "trx;LogFileName=fiscal.trx" --results-directory TestResults

      - name: Nenhum teste pode ter pulado
        shell: python
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          report = glob.glob("TestResults/**/fiscal.trx", recursive=True)[0]  # o job já roda em apps/fiscal-net
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters = ET.parse(report).getroot().find("t:ResultSummary/t:Counters", ns)
          total, executed = int(counters.get("total")), int(counters.get("executed"))
          print(f"{total} testes, {executed} executados")
          if executed != total or total == 0:
              sys.exit("Teste pulado não prova nada.")

      # A imagem de produção: sobe como uid 10001, responde o health com o motor
      # real e recusa pedido sem o token.
      - name: A imagem sobe e protege as rotas
        run: |
          docker build -t erp-fiscal:ci .
          docker run -d --name fiscal -p 8081:8081 -e FISCAL_SERVICE_TOKEN=token-de-ci erp-fiscal:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8081/health && break; sleep 1; done
          echo
          curl -sf http://localhost:8081/health | grep -q '"engine":"nfce-4.00"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/v1/fiscal/status \
            -H 'Content-Type: application/json' -d '{"request_uuid":"x"}')" = 401
          curl -sf -X POST http://localhost:8081/v1/fiscal/status -H 'Authorization: Bearer token-de-ci' \
            -H 'Content-Type: application/json' -d '{"request_uuid":"x"}' | grep -q NOT_FOUND
          test "$(docker exec fiscal id -u)" = 10001

  # ---------------------------------------------------------------------------
  e2e:
    name: Ponta a ponta pela imagem Docker
    # Depois da nuvem: não adianta construir a imagem de um código que já
    # reprovou nos testes.
    needs: cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Postgres
        run: |
          docker run -d --name erp-pg-test -p 55432:5432 \
            -e POSTGRES_USER=erp -e POSTGRES_PASSWORD=erp -e POSTGRES_DB=erp \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec erp-pg-test pg_isready -U erp -d erp && break
            sleep 1
          done

      - name: Construir a imagem
        run: docker build -t erp-cloud-api:test apps/cloud-api

      # Sem as variáveis do serviço fiscal, de propósito: a retaguarda precisa
      # ficar saudável sem ele. Uma versão anterior respondia 503 no health e
      # o deploy nunca ficava verde no Coolify.
      - name: Subir a retaguarda como no Coolify
        run: |
          docker run -d --name erp-api-test -p 3111:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e ADMIN_DATABASE_URL="postgres://erp:erp@host.docker.internal:55432/erp" \
            -e DATABASE_URL="postgres://erp_app:senha-de-ci-do-papel-app@host.docker.internal:55432/erp" \
            -e APP_DB_PASSWORD="senha-de-ci-do-papel-app" \
            -e SESSION_SECRET="chave-de-sessao-de-ci" \
            -e APP_VERSION="${GITHUB_SHA::8}" \
            erp-cloud-api:test
          for i in $(seq 1 60); do
            curl -fs http://localhost:3111/api/health > health.json && break
            sleep 1
          done
          cat health.json

      - name: O health diz o que precisa dizer
        run: |
          python - <<'EOF'
          import json, sys
          health = json.load(open("health.json"))
          expected = {"database": "ok", "tenant_isolation": "ativo", "fiscal": "desligado"}
          wrong = {k: health.get(k) for k, v in expected.items() if health.get(k) != v}
          if wrong:
              sys.exit(f"health inesperado: {wrong}")
          print("health ok:", expected)
          EOF

      - name: O fluxo do terminal
        run: python apps/cloud-api/scripts/e2e.py

      # O `e2e.py` monta payloads à mão; este usa o código do PDV — ativação,
      # bootstrap, outbox, SyncEngine e HttpTransport. Foi por esse vão que
      # passaram o fechamento de pedido recusado pela nuvem, a ativação sem o
      # segredo do ledger e a rota sem `/api`: cada lado passava nos próprios
      # testes, e um terminal real nunca sincronizou.
      - name: O PDV de verdade contra a imagem
        run: |
          pip install httpx==0.28.1 pydantic==2.13.5 argon2-cffi==25.1.0
          python apps/cloud-api/scripts/e2e_terminal.py

      - name: Log do contêiner, se algo falhou
        if: failure()
        run: docker logs erp-api-test
