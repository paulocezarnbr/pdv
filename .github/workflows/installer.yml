# =============================================================================
# Instalador do PDV — PDV-Setup-x.y.z.exe gerado numa máquina Windows limpa
# =============================================================================
#
# O instalador só pode ser construído em Windows (PyInstaller não faz build
# cruzado, e o Inno Setup é Windows). Fazer isso num runner descartável, e não
# na máquina de alguém, tem dois efeitos que valem mais que a conveniência:
#
# * o pacote é montado SÓ com os pins do requirements.txt, num Python limpo —
#   nada instalado "de outro projeto" vaza para dentro do PDV.exe;
# * o `build.ps1` roda a suíte, compila e executa o `--selftest` DENTRO do
#   binário empacotado. Pacote incompleto reprova aqui, não na loja.
#
# O resultado fica em Actions → esta execução → Artifacts. Numa tag
# `pdv-v1.2.3` ele também vira uma Release, com o SHA-256 ao lado.
#
# Assinatura: com os secrets PDV_SIGN_CERT_BASE64 (o .pfx em base64) e
# PDV_SIGN_PASSWORD, os dois executáveis e o instalador saem assinados e com
# carimbo de tempo. Sem eles, sai sem assinatura e o SmartScreen avisa
# "Editor desconhecido" — o build não falha por isso, porque o certificado EV
# é insumo que ainda não existe (ver plan.md, Fase 2.5).

name: Instalador do PDV

on:
  workflow_dispatch:
  push:
    tags: ["pdv-v*"]
    branches: [main, "claude/**"]
    paths:
      - "apps/desktop-pdv/**"
      - ".github/workflows/installer.yml"

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # só usado na tag, para publicar a Release

jobs:
  build:
    name: PDV-Setup (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop-pdv
    steps:
      - uses: actions/checkout@v4

      # O mesmo runtime do job `desktop` do CI: os pins foram verificados nele.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/desktop-pdv/requirements.txt

      # O teste de contrato criptográfico executa a assinatura da nuvem em
      # TypeScript. Sem Node ele pula, e o build.ps1 roda a suíte inteira.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar exatamente os pins
        run: python -m pip install -r requirements.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      # O redistribuível não é versionado (binário de terceiro). Baixado aqui
      # e CONFERIDO: um instalador que roda como administrador não pode
      # embarcar um executável qualquer que veio da rede.
      - name: Visual C++ Redistributable
        run: |
          $target = 'packaging\redist\VC_redist.x64.exe'
          curl.exe -fsSL -o $target https://aka.ms/vs/17/release/vc_redist.x64.exe
          $signature = Get-AuthenticodeSignature $target
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw "VC_redist sem assinatura valida da Microsoft: $($signature.Status)"
          }
          Write-Host "VC_redist OK: $($signature.SignerCertificate.Subject)"

      - name: Certificado de assinatura (opcional)
        id: sign
        env:
          CERT_B64: ${{ secrets.PDV_SIGN_CERT_BASE64 }}
        run: |
          if ($env:CERT_B64) {
            $path = Join-Path $env:RUNNER_TEMP 'pdv-sign.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_B64))
            "cert=$path" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '::warning::Sem PDV_SIGN_CERT_BASE64: o instalador sai sem assinatura.'
          }

      - name: Build (testes, binário, autoteste, instalador)
        env:
          QT_QPA_PLATFORM: offscreen
          PDV_SIGN_PASSWORD: ${{ secrets.PDV_SIGN_PASSWORD }}
        run: |
          $params = @{ RequireInstaller = $true }
          if ('${{ steps.sign.outputs.cert }}') {
            $params.SignCert = '${{ steps.sign.outputs.cert }}'
            if ($env:PDV_SIGN_PASSWORD) { $params.SignPassword = $env:PDV_SIGN_PASSWORD }
          }
          .\packaging\build.ps1 @params

      - name: Conferir o instalador
        id: out
        run: |
          $setup = Get-ChildItem 'dist\installer\PDV-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Instalador nao foi gerado.' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -Encoding ascii "$($setup.FullName).sha256"
          $mb = [math]::Round($setup.Length / 1MB, 1)
          Write-Host "$($setup.Name) - $mb MB - sha256 $hash"
          "name=$($setup.BaseName)" >> $env:GITHUB_OUTPUT
          "## $($setup.Name)`n`n- Tamanho: $mb MB`n- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: |
            apps/desktop-pdv/dist/installer/PDV-Setup-*.exe
            apps/desktop-pdv/dist/installer/PDV-Setup-*.exe.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/pdv-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            (Get-ChildItem 'dist\installer\PDV-Setup-*.exe*').FullName `
            --title "PDV ${{ github.ref_name }}" --generate-notes
